<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-TEK OfficePack — Desktop Process Manager</title>
    <style>
      :root {
        --primary: #6938ef;
        --primary-hover: #5925dc;
        --primary-light: #f4f3ff;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --surface-card: #ffffff;
        --border: #e2e8f0;
        --border-hover: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
        --text-light: #94a3b8;
        --success: #12b76a;
        --success-light: #ecfdf3;
        --danger: #f04438;
        --danger-light: #fef3f2;
        --warning: #f79009;
        --warning-light: #fffaeb;
        --shadow-sm: 0 1px 2px 0 rgba(16, 24, 40, 0.05);
        --shadow-md: 0 4px 6px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.04);
        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "Fira Code", monospace, Consolas, Monaco;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--surface-muted);
        color: var(--text);
        font-size: 12px;
        line-height: 1.4;
        overflow-x: hidden;
        transform-origin: top left;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Compact Downsized Titlebar & Header */
      .app-header {
        background-color: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 6px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 30;
        gap: 10px;
        -webkit-app-region: drag;
        user-select: none;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        -webkit-app-region: drag;
      }

      .header-branding {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }

      .branding-icon {
        width: 26px;
        height: 26px;
        border-radius: var(--radius-sm);
        background: linear-gradient(135deg, var(--primary) 0%, #4424a7 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      .branding-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        -webkit-app-region: drag;
      }

      .branding-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        line-height: 1.2;
        -webkit-app-region: drag;
      }

      .app-version-badge {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        color: var(--primary);
        background-color: rgba(105, 56, 239, 0.08);
        border: 1px solid rgba(105, 56, 239, 0.25);
        padding: 1px 5px;
        border-radius: var(--radius-xs);
        line-height: 1.2;
        letter-spacing: 0.02em;
        user-select: none;
        -webkit-app-region: drag;
      }

      .branding-subtitle {
        font-size: 10px;
        color: var(--text-muted);
        line-height: 1.2;
        -webkit-app-region: drag;
      }

      .header-center {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stats-badge-group {
        display: flex;
        align-items: center;
        gap: 6px;
        -webkit-app-region: drag;
      }

      .metric-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
        background-color: var(--surface);
        -webkit-app-region: drag;
      }

      .metric-pill.running {
        background-color: var(--success-light);
        border-color: rgba(18, 183, 106, 0.3);
        color: var(--success);
      }

      .metric-pill.stopped {
        background-color: var(--danger-light);
        border-color: rgba(240, 68, 56, 0.3);
        color: var(--danger);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .action-button,
      .zoom-controls-group,
      .window-controls-group,
      .zoom-btn,
      .zoom-indicator-btn,
      .win-ctrl-btn,
      button,
      input,
      select,
      a {
        -webkit-app-region: no-drag;
      }

      /* Zoom Controls Group */
      .zoom-controls-group {
        display: flex;
        align-items: center;
        background-color: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-xs);
        padding: 1px 2px;
        gap: 1px;
      }

      .zoom-btn {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--text);
        border-radius: 3px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease;
      }

      .zoom-btn:hover {
        background-color: var(--border);
      }

      .zoom-indicator-btn {
        height: 22px;
        padding: 0 5px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 10px;
        font-family: var(--font-mono);
        font-weight: 600;
        cursor: pointer;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .zoom-indicator-btn:hover {
        background-color: var(--border);
        color: var(--text);
      }

      /* Window Control Buttons */
      .window-controls-group {
        display: flex;
        align-items: center;
        margin-left: 4px;
        gap: 2px;
      }

      .win-ctrl-btn {
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        border-radius: var(--radius-xs);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .win-ctrl-btn:hover {
        background-color: var(--surface-muted);
        color: var(--text);
      }

      .win-ctrl-btn.close-btn:hover {
        background-color: var(--danger);
        color: #ffffff;
      }

      /* Compact Action Buttons */
      .action-button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: var(--radius-xs);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
        background-color: var(--surface);
        line-height: 1;
        white-space: nowrap;
      }

      .action-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      .btn-start {
        background-color: var(--success);
        color: #ffffff;
      }
      .btn-start:hover:not(:disabled) {
        background-color: #0e9355;
      }

      .btn-stop {
        background-color: var(--danger);
        color: #ffffff;
      }
      .btn-stop:hover:not(:disabled) {
        background-color: #d92d20;
      }

      .btn-secondary {
        border-color: var(--border);
        color: var(--text);
        background-color: var(--surface);
      }
      .btn-secondary:hover:not(:disabled) {
        background-color: var(--surface-muted);
        border-color: var(--border-hover);
      }

      .btn-danger {
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        background-color: rgba(239, 68, 68, 0.12);
      }
      .btn-danger:hover:not(:disabled) {
        background-color: rgba(239, 68, 68, 0.25);
        border-color: #ef4444;
        color: #ffffff;
      }

      .btn-sm {
        padding: 3px 6px;
        font-size: 10px;
      }

      /* Compact Main Content */
      .app-content {
        flex: 1;
        padding: 10px 14px;
        max-width: 100%;
        margin: 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .keep-toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        user-select: none;
        background-color: var(--surface-muted);
        padding: 3px 8px;
        border-radius: var(--radius-xs);
        border: 1px solid var(--border);
        -webkit-app-region: no-drag;
      }

      .keep-toggle-label input {
        cursor: pointer;
        accent-color: var(--primary);
      }

      /* Instances List Layout (List view, not grid) */
      .instances-list-section {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-sm);
        overflow-x: auto;
      }

      .instances-list-table {
        display: flex;
        flex-direction: column;
        min-width: 820px;
        width: 100%;
      }

      .instances-list-header {
        display: grid;
        grid-template-columns: minmax(300px, 4fr) 105px 75px 75px 90px 85px 175px;
        align-items: center;
        padding: 7px 12px;
        background-color: var(--surface-muted);
        border-bottom: 1px solid var(--border);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        gap: 8px;
        user-select: none;
      }

      .instances-list-body {
        display: flex;
        flex-direction: column;
      }

      .instance-list-row {
        display: grid;
        grid-template-columns: minmax(300px, 4fr) 105px 75px 75px 90px 85px 175px;
        align-items: center;
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        gap: 8px;
        background-color: var(--surface);
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      .instance-list-row:last-child {
        border-bottom: none;
      }

      .instance-list-row:hover {
        background-color: #fbfaff;
      }

      .instance-list-row.running {
        background-color: rgba(18, 183, 106, 0.02);
      }

      .instance-list-row.running:hover {
        background-color: rgba(18, 183, 106, 0.05);
      }

      .col-header {
        display: flex;
        align-items: center;
      }

      .col-header-right {
        justify-content: flex-end;
      }

      .cell-service {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
      }

      .cell-service-text {
        min-width: 0;
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        gap: 6px;
        flex-wrap: nowrap;
        overflow: hidden;
      }

      .cell-service-info-inline {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        gap: 6px;
        flex-wrap: nowrap;
        overflow: hidden;
      }

      .instance-category-icon {
        width: 24px;
        height: 24px;
        border-radius: var(--radius-xs);
        background-color: var(--primary-light);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .instance-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }

      .instance-id-label {
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--text-muted);
        background-color: var(--surface-muted);
        padding: 1px 6px;
        border-radius: var(--radius-xs);
        border: 1px solid var(--border);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 1;
      }

      .instance-category-badge {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--primary);
        background-color: var(--primary-light);
        padding: 1px 5px;
        border-radius: var(--radius-xs);
        border: 1px solid rgba(105, 56, 239, 0.2);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .cell-status {
        display: flex;
        align-items: center;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        flex-shrink: 0;
      }

      .status-pill.running {
        background-color: var(--success-light);
        color: var(--success);
      }

      .status-pill.stopped {
        background-color: var(--danger-light);
        color: var(--danger);
      }

      .status-pill.starting {
        background-color: var(--warning-light);
        color: var(--warning);
      }

      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: currentColor;
      }

      .status-pill.running .pulse-dot {
        animation: pulseAnimation 1.6s infinite ease-in-out;
      }

      @keyframes pulseAnimation {
        0% { transform: scale(0.9); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.4; }
        100% { transform: scale(0.9); opacity: 1; }
      }

      .cell-telemetry {
        display: flex;
        align-items: center;
      }

      .telemetry-value {
        font-size: 11px;
        font-weight: 600;
        color: var(--text);
        font-family: var(--font-mono);
      }

      .telemetry-value.link {
        color: var(--primary);
        text-decoration: none;
      }
      .telemetry-value.link:hover {
        text-decoration: underline;
      }

      .cell-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
      }

      /* Integrated Live Logs Display Section */
      .display-logs-section {
        background-color: #0b0f19;
        border: 1px solid #1e293b;
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-top: 4px;
      }

      .logs-toolbar {
        padding: 6px 12px;
        background-color: #070a12;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .logs-toolbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logs-toolbar-title {
        font-size: 11px;
        font-weight: 600;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .logs-select-filter {
        background-color: #111827;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: var(--font-sans);
        outline: none;
        cursor: pointer;
      }

      .logs-select-filter:focus {
        border-color: var(--primary);
      }

      .logs-daily-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background-color: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 11px;
        color: #38bdf8;
        font-family: var(--font-mono);
      }

      .logs-daily-badge strong {
        color: #f1f5f9;
        font-weight: 600;
      }

      .logs-toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logs-autoscroll-label {
        font-size: 10px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .logs-autoscroll-label input {
        cursor: pointer;
        accent-color: var(--primary);
      }

      .display-logs-terminal {
        height: 180px;
        min-height: 90px;
        max-height: 480px;
        overflow-y: auto;
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.5;
        background-color: #060911;
        color: #e2e8f0;
        resize: vertical;
      }

      .display-logs-terminal.expanded {
        height: 320px;
      }

      .log-line {
        display: flex;
        gap: 8px;
        word-break: break-all;
        margin-bottom: 2px;
      }

      .log-time {
        color: #64748b;
        flex-shrink: 0;
      }

      .log-inst-tag {
        color: #94a3b8;
        background-color: #1e293b;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        flex-shrink: 0;
      }

      .log-msg-stdout { color: #e2e8f0; }
      .log-msg-stderr { color: #f87171; }
      .log-msg-info { color: #38bdf8; }
      .log-msg-error { color: #f87171; }
      .log-msg-warn { color: #fbbf24; }

      .empty-logs-placeholder {
        color: #64748b;
        text-align: center;
        padding: 30px 0;
        font-size: 11px;
      }

      /* Secondary Log Drawer Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }

      .modal-backdrop.active {
        display: flex;
      }

      .log-modal-window {
        background-color: #0f172a;
        color: #f8fafc;
        width: 820px;
        max-width: 92vw;
        height: 520px;
        max-height: 86vh;
        border-radius: var(--radius-md);
        border: 1px solid #334155;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .log-modal-header {
        padding: 10px 14px;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #090d16;
      }

      .log-modal-title {
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .log-terminal-body {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.5;
        background-color: #060911;
      }
    </style>
  </head>
  <body>
    <div id="officepack-desktop-root" class="app-layout">
      <!-- Compact Header with Title, Controls, Zoom, and Window Actions -->
      <header id="officepack-header-container" class="app-header">
        <div id="officepack-header-left" class="header-left">
          <div id="officepack-branding-container" class="header-branding">
            <div id="officepack-branding-icon" class="branding-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div id="officepack-branding-text">
              <div id="officepack-title-row" class="branding-title-row">
                <h1 id="officepack-app-title" class="branding-title">2-TEK OfficePack Desktop</h1>
                <span id="officepack-app-version" class="app-version-badge">v1.0.0</span>
              </div>
              <p id="officepack-app-subtitle" class="branding-subtitle">Multi-Process Instance Manager &amp; Service Supervisor</p>
            </div>
          </div>
        </div>

        <div id="officepack-header-center" class="header-center">
          <div id="officepack-stats-badges" class="stats-badge-group">
            <div id="officepack-running-badge" class="metric-pill running">
              <span class="pulse-dot"></span>
              <span id="officepack-running-count">0</span>
              <span id="label-running-stat">Running</span>
            </div>
            <div id="officepack-stopped-badge" class="metric-pill stopped">
              <span id="officepack-stopped-count">0</span>
              <span id="label-stopped-stat">Stopped</span>
            </div>
          </div>

          <button id="btn-start-all" class="action-button btn-start" onclick="handleStartAll()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span id="label-start-all">Start All</span>
          </button>

          <button id="btn-stop-all" class="action-button btn-stop" onclick="handleStopAll()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            </svg>
            <span id="label-stop-all">Stop All</span>
          </button>

          <button id="btn-refresh-instances" class="action-button btn-secondary" onclick="refreshInstancesList()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>

      function getDesktopBridge() {
        return window.officepackDesktop || window.electronAPI || null;
      }

      /* Zoom Handling */
      async function handleZoomIn() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.zoomIn === "function") {
          currentZoomLevel = await bridge.zoomIn();
        } else {
          currentZoomLevel = Math.min(2.5, Math.round((currentZoomLevel + 0.1) * 10) / 10);
          document.body.style.zoom = String(currentZoomLevel);
        }
        updateZoomIndicator();
      }

      async function handleZoomOut() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.zoomOut === "function") {
          currentZoomLevel = await bridge.zoomOut();
        } else {
          currentZoomLevel = Math.max(0.5, Math.round((currentZoomLevel - 0.1) * 10) / 10);
          document.body.style.zoom = String(currentZoomLevel);
        }
        updateZoomIndicator();
      }

      async function handleZoomReset() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.resetZoom === "function") {
          currentZoomLevel = await bridge.resetZoom();
        } else {
          currentZoomLevel = 1.0;
          document.body.style.zoom = "1";
        }
        updateZoomIndicator();
      }

      function updateZoomIndicator() {
        const indicator = document.getElementById("label-zoom-level");
        if (indicator) {
          const percent = Math.round(currentZoomLevel * 100);
          indicator.textContent = `${percent}%`;
        }
      }

      /* Window Controls & Process Persistence */
      async function handleWindowMinimize() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.minimizeWindow === "function") {
          await bridge.minimizeWindow();
        }
      }

      async function handleWindowMaximize() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.maximizeWindow === "function") {
          await bridge.maximizeWindow();
        }
      }

      async function handleWindowClose() {
        const bridge = getDesktopBridge();
        const chk = document.getElementById("chk-keep-processes");
        const keepRunning = chk ? chk.checked : true;

        if (bridge && typeof bridge.setKeepProcessesOnClose === "function") {
          try {
            await bridge.setKeepProcessesOnClose(keepRunning);
          } catch {}
        }

        if (bridge && typeof bridge.closeWindow === "function") {
          try {
            await bridge.closeWindow();
          } catch {}
        } else if (bridge && typeof bridge.killElectron === "function") {
          try {
            await bridge.killElectron();
          } catch {}
        } else {
          window.close();
        }
      }

      async function handleKeepProcessesChange(enabled) {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.setKeepProcessesOnClose === "function") {
          await bridge.setKeepProcessesOnClose(enabled);
        }
      }

      /* Instances Fetching & Rendering */
      async function fetchInstances() {
        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.listInstances === "function") {
          return await bridge.listInstances();
        }

        try {
          const response = await fetch("http://localhost:3100/api/instances");
          if (response.ok) {
            const result = await response.json();
            return result.data || [];
          }
        } catch {}

        return [
          {
            id: "officepack-server-3100",
            name: "OfficePack Primary Service & gRPC Host",
            category: "service",
            port: 3100,
            host: "127.0.0.1",
            url: "http://127.0.0.1:3100",
            status: "running",
            pid: 24102,
            uptimeSeconds: 124,
            memoryMb: 42,
            canStart: false,
            canStop: true,

      function formatUptime(seconds) {
        if (!seconds || seconds <= 0) return "--";
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (mins === 0) return `${secs}s`;
        const hrs = Math.floor(mins / 60);
        const remMins = mins % 60;
        if (hrs === 0) return `${mins}m ${secs}s`;
        return `${hrs}h ${remMins}m`;
      }

      function updateFilterDropdownOptions() {
        const select = document.getElementById("select-logs-filter");
        if (!select) return;

        const currentValue = select.value;
        select.innerHTML = `<option value="all">${t("allProcesses")}</option>`;

        instancesCache.forEach((instance) => {
          const opt = document.createElement("option");
          opt.value = instance.id;
          opt.textContent = `${instance.name} (Port ${instance.port})`;
          select.appendChild(opt);
        });

        if (currentValue && (currentValue === "all" || instancesCache.some((i) => i.id === currentValue))) {
          select.value = currentValue;
        }
      }

      function renderInstances(instances) {

          listBody.innerHTML = "";

        let runningCount = 0;
        let stoppedCount = 0;

          else stoppedCount++;

          row.id = `officepack-instance-card-${instance.id}`;
          row.className = `instance-list-row ${instance.status === "running" ? "running" : ""}`;

          const isRunning = instance.status === "running";
          const statusClass = instance.status || "stopped";
          const statusText = t(instance.status || "stopped");

          let categoryIconSvg = `

              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>

                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>

            categoryIconSvg = `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="3" y1="15" x2="21" y2="15"></line>

                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>

              <div id="card-meta-${instance.id}" class="cell-service-text cell-service-info-inline">

                <span id="subid-${instance.id}" class="instance-id-label inline-id">${instance.id}</span>

            <div id="memory-cell-${instance.id}" class="cell-telemetry">
              <span id="memory-val-${instance.id}" class="telemetry-value">${instance.memoryMb ? instance.memoryMb + " MB" : "--"}</span>

              <div id="actions-left-${instance.id}" class="left-actions">

                        </svg>
                        <span>${t("stop")}</span>
                      </button>`
                }

                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>

                  <span>${t("restart")}</span>

                  <polyline points="4 17 10 11 4 5"></polyline>

        document.getElementById("officepack-running-count").textContent = String(runningCount);
        document.getElementById("officepack-stopped-count").textContent = String(stoppedCount);

        updateFilterDropdownOptions();
      }

      async function refreshInstancesList() {
        const instances = await fetchInstances();
        renderInstances(instances);
      }

      async function handleStartInstance(instanceId) {
        const button = document.getElementById(`btn-start-${instanceId}`);
        if (button) button.disabled = true;

        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.startInstance === "function") {
          await bridge.startInstance(instanceId);
        } else {
          try {
            await fetch(`http://localhost:3100/api/instances/${instanceId}/start`, { method: "POST" });
          } catch {}
        }

        await refreshInstancesList();
      }

      async function handleStopInstance(instanceId) {
        const button = document.getElementById(`btn-stop-${instanceId}`);
        if (button) button.disabled = true;

        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.stopInstance === "function") {
          await bridge.stopInstance(instanceId);
        } else {
          try {
            await fetch(`http://localhost:3100/api/instances/${instanceId}/stop`, { method: "POST" });
          } catch {}
        }

        await refreshInstancesList();
      }

      async function handleRestartInstance(instanceId) {
        const button = document.getElementById(`btn-restart-${instanceId}`);
        if (button) button.disabled = true;

        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.restartInstance === "function") {
          await bridge.restartInstance(instanceId);
        } else {
          try {
            await fetch(`http://localhost:3100/api/instances/${instanceId}/restart`, { method: "POST" });
          } catch {}
        }

        await refreshInstancesList();
      }

      async function handleStartAll() {
        const btn = document.getElementById("btn-start-all");
        if (btn) btn.disabled = true;

        for (const inst of instancesCache) {
          if (inst.status !== "running") {
            await handleStartInstance(inst.id);
          }
        }

        if (btn) btn.disabled = false;
        await refreshInstancesList();
      }

      async function handleStopAll() {
        const btn = document.getElementById("btn-stop-all");
        if (btn) btn.disabled = true;

        for (const inst of instancesCache) {
          if (inst.status === "running") {
            await handleStopInstance(inst.id);
          }
        }

        if (btn) btn.disabled = false;
        await refreshInstancesList();
      }

      async function handleEmptyPorts() {
        const btn = document.getElementById("btn-empty-ports");
        if (btn) btn.disabled = true;

        try {
          if (bridge && typeof bridge.emptyPorts === "function") {
            const result = await bridge.emptyPorts();
            if (result && result.freedCount > 0) {
              appendLiveLog({
                timestamp: new Date().toISOString(),
                instanceId: "system",
                level: "info",
                message: result.message || `Emptied ports: ${result.releasedPorts.join(", ")}`,
              });
            }
          } else {
            const response = await fetch("/api/ports/empty", { method: "POST" });
            const data = await response.json();
            if (data && data.data && data.data.freedCount > 0) {
              appendLiveLog({
                timestamp: new Date().toISOString(),
                instanceId: "system",
                level: "info",
                message: data.data.message || `Emptied ports: ${data.data.releasedPorts.join(", ")}`,
              });
            }
          }
        } catch (emptyErr) {
          console.error("Failed to empty ports:", emptyErr);
        } finally {
          if (btn) btn.disabled = false;
          await refreshInstancesList();
        }
      }

      async function handleCloudSync() {
        const btn = document.getElementById("btn-cloud-sync");
        const label = document.getElementById("label-cloud-sync");
        if (btn) btn.disabled = true;
        if (label) label.textContent = "Syncing...";

        try {
          let syncResult = null;
          if (bridge && typeof bridge.syncCloudData === "function") {
            syncResult = await bridge.syncCloudData({ direction: "bidirectional" });
          } else {
            const response = await fetch("/api/cloud/sync", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ direction: "bidirectional" }),
            });
            const resJson = await response.json();
            syncResult = resJson.data;
          }

          appendLiveLog({
            timestamp: new Date().toISOString(),
            instanceId: "cloud-sync",
            level: "info",
            message: `Cloud sync completed: pulled ${syncResult?.pulledCount || 0}, pushed ${syncResult?.pushedCount || 0} file(s)`,
          });
        } catch (syncErr) {
          console.error("Failed to sync cloud:", syncErr);
          appendLiveLog({
            timestamp: new Date().toISOString(),
            instanceId: "cloud-sync",
            level: "error",
            message: `Cloud sync failed: ${syncErr.message || syncErr}`,
          });
        } finally {
          if (btn) btn.disabled = false;
          if (label) label.textContent = t("syncCloud");
        }
      }

      let currentBroadcastMode = "disabled";

      async function refreshBroadcastStatus() {
        try {
          let status = null;
          if (bridge && typeof bridge.getBroadcastStatus === "function") {
            status = await bridge.getBroadcastStatus();
          } else {
            const response = await fetch("/api/broadcast/status");
            const resJson = await response.json();
            status = resJson.data;
          }
          if (status && status.mode) {
            currentBroadcastMode = status.mode;
            const label = document.getElementById("label-broadcast");
            if (label) {
              const modeDisplay = currentBroadcastMode === "center" ? "Center (Hub)" : currentBroadcastMode === "client" ? "Client (Node)" : "Off";
              label.textContent = `${t("broadcast")}: ${modeDisplay}`;
            }
          }
        } catch (e) {
          // ignore error on periodic refresh
        }
      }

      async function handleBroadcastToggle() {
        const btn = document.getElementById("btn-broadcast-toggle");
        const label = document.getElementById("label-broadcast");
        if (btn) btn.disabled = true;

        const nextMode = currentBroadcastMode === "disabled" ? "center" : currentBroadcastMode === "center" ? "client" : "disabled";

        try {
          let result = null;
          if (bridge && typeof bridge.setBroadcastMode === "function") {
            result = await bridge.setBroadcastMode({ mode: nextMode });
          } else {
            const response = await fetch("/api/broadcast/mode", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ mode: nextMode }),
            });
            const resJson = await response.json();
            result = resJson.data;
          }
          currentBroadcastMode = nextMode;
          const modeDisplay = currentBroadcastMode === "center" ? "Center (Hub)" : currentBroadcastMode === "client" ? "Client (Node)" : "Off";
          if (label) label.textContent = `${t("broadcast")}: ${modeDisplay}`;

          appendLiveLog({
            timestamp: new Date().toISOString(),
            instanceId: "broadcast",
            level: "info",
            message: `Broadcast mode set to: ${nextMode.toUpperCase()}${nextMode === "center" ? " (Computer is now Chat Center Hub)" : nextMode === "client" ? " (Computer is now Broadcast Client)" : ""}`,
          });
        } catch (err) {
          console.error("Failed to toggle broadcast mode:", err);
          appendLiveLog({
            timestamp: new Date().toISOString(),
            instanceId: "broadcast",
            level: "error",
            message: `Failed to toggle broadcast mode: ${err.message || err}`,
          });
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      /* Live Logs Display & Filtering */

      function appendLiveLog(logEntry) {
        aggregatedLogsCache.push(logEntry);
        if (aggregatedLogsCache.length > 500) {
          aggregatedLogsCache.shift();
        }

        if (selectedFilterInstanceId === "all" || selectedFilterInstanceId === logEntry.instanceId) {
          appendLogLineToDom(logEntry);
        }

        if (activeLogInstanceId && activeLogInstanceId === logEntry.instanceId) {
          refreshModalLogViewer();
        }
      }

      function appendLogLineToDom(logEntry) {
        const container = document.getElementById("officepack-display-logs-terminal");
        if (!container) return;

        const placeholder = document.getElementById("empty-logs-placeholder");
        if (placeholder) {
          placeholder.remove();
        }

        const line = document.createElement("div");
        line.className = "log-line";
        const shortTime = logEntry.timestamp ? logEntry.timestamp.slice(11, 19) : "--:--:--";
        const instTag = logEntry.instanceId ? logEntry.instanceId.replace("office-", "").replace("officepack-", "") : "inst";

        line.innerHTML = `
          <span class="log-time">[${shortTime}]</span>
          <span class="log-inst-tag">${instTag}</span>
          <span class="log-msg-${logEntry.level || 'stdout'}">${escapeHtml(logEntry.message)}</span>
        `;

        container.appendChild(line);

        const chkAutoscroll = document.getElementById("chk-logs-autoscroll");
        if (chkAutoscroll && chkAutoscroll.checked) {
          container.scrollTop = container.scrollHeight;
        }
      }

      function renderDisplayLogs() {
        const container = document.getElementById("officepack-display-logs-terminal");
        if (!container) return;

        const filtered = aggregatedLogsCache.filter((entry) => {
          if (selectedFilterInstanceId === "all") return true;
          return entry.instanceId === selectedFilterInstanceId;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div id="empty-logs-placeholder" class="empty-logs-placeholder">${t("noLogs")}</div>`;
          return;
        }

        container.innerHTML = filtered
          .map((entry) => {
            const shortTime = entry.timestamp ? entry.timestamp.slice(11, 19) : "--:--:--";
            const instTag = entry.instanceId ? entry.instanceId.replace("office-", "").replace("officepack-", "") : "inst";
            return `
              <div class="log-line">
                <span class="log-time">[${shortTime}]</span>
                <span class="log-inst-tag">${instTag}</span>
                <span class="log-msg-${entry.level || 'stdout'}">${escapeHtml(entry.message)}</span>
              </div>
            `;
          })
          .join("");

        const chkAutoscroll = document.getElementById("chk-logs-autoscroll");
        if (chkAutoscroll && chkAutoscroll.checked) {
          container.scrollTop = container.scrollHeight;
        }
      }

      function handleLogFilterChange(val) {
        selectedFilterInstanceId = val;
        renderDisplayLogs();
      }

      async function handleEmptyLogsFile() {
        const bridge = getDesktopBridge();
        const currentDateStr = new Date().toISOString().slice(0, 10);
        try {
          if (bridge && typeof bridge.emptyGrpcLogs === "function") {
            await bridge.emptyGrpcLogs("all");
          }
          aggregatedLogsCache = [];
          renderDisplayLogs();
          console.log(`[OfficePack] Daily logs emptied for date: ${currentDateStr}`);
        } catch (err) {
          console.error("[OfficePack] Failed to empty daily logs:", err);
        }
      }

      function handleClearDisplayLogs() {
        if (selectedFilterInstanceId === "all") {
          aggregatedLogsCache = [];
        } else {
          aggregatedLogsCache = aggregatedLogsCache.filter((e) => e.instanceId !== selectedFilterInstanceId);
        }
        renderDisplayLogs();
      }

      function handleToggleLogsSize() {
        const terminal = document.getElementById("officepack-display-logs-terminal");
        if (!terminal) return;
        isLogsExpanded = !isLogsExpanded;
        if (isLogsExpanded) {
          terminal.classList.add("expanded");
        } else {
          terminal.classList.remove("expanded");
        }
      }

      function focusInstanceLogs(instanceId) {
        selectedFilterInstanceId = instanceId;
        const select = document.getElementById("select-logs-filter");
        if (select) {
          select.value = instanceId;
        }
        renderDisplayLogs();

        const section = document.getElementById("officepack-display-logs-section");
        if (section) {
          section.scrollIntoView({ behavior: "smooth" });
        }
      }

      /* Secondary Modal Logs */
      async function openLogModal(instanceId) {
        activeLogInstanceId = instanceId;
        const target = instancesCache.find((i) => i.id === instanceId);
        document.getElementById("log-modal-target-title").textContent = target
          ? `${target.name} (${target.port})`
          : instanceId;

        const modal = document.getElementById("officepack-log-modal-backdrop");
        modal.classList.add("active");

        await refreshModalLogViewer();
      }

      function closeLogModal() {
        activeLogInstanceId = null;
        const modal = document.getElementById("officepack-log-modal-backdrop");
        modal.classList.remove("active");
      }

      async function refreshModalLogViewer() {
        if (!activeLogInstanceId) return;

        const container = document.getElementById("officepack-log-terminal-body");
        let logs = [];

        const bridge = getDesktopBridge();
        if (bridge && typeof bridge.getInstanceLogs === "function") {
          logs = await bridge.getInstanceLogs(activeLogInstanceId);
        } else {
          try {
            const resp = await fetch(`http://localhost:3100/api/instances/${activeLogInstanceId}/logs`);
            if (resp.ok) {
              const resJson = await resp.json();
              logs = resJson.data || [];
            }
          } catch {}
        }

        if (!logs || logs.length === 0) {
          container.innerHTML = `<div id="empty-modal-logs-msg" class="empty-logs-placeholder">${t("noLogs")}</div>`;
          return;
        }

        container.innerHTML = logs
          .map(
            (log, idx) => `
              <div id="modal-log-line-${activeLogInstanceId}-${idx}" class="log-line">
                <span class="log-time">[${log.timestamp ? log.timestamp.slice(11, 19) : "--:--:--"}]</span>
                <span class="log-msg-${log.level || 'stdout'}">${escapeHtml(log.message)}</span>
              </div>
            `
          )
          .join("");

        container.scrollTop = container.scrollHeight;
      }

      function handleClearActiveLogs() {
        const container = document.getElementById("officepack-log-terminal-body");
        container.innerHTML = `<div id="empty-modal-logs-msg" class="empty-logs-placeholder">${t("noLogs")}</div>`;
      }

      function escapeHtml(text) {
        return (text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      /* Keyboard Shortcuts for Zoom */
      window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === "=" || e.key === "+") {
            e.preventDefault();
            handleZoomIn();
          } else if (e.key === "-") {
            e.preventDefault();
            handleZoomOut();
          } else if (e.key === "0") {
            e.preventDefault();
            handleZoomReset();
          }
        }
      });

      /* Initialization & Event Listeners */
      window.addEventListener("DOMContentLoaded", async () => {
        updateStaticLabels();
        await refreshInstancesList();

        const bridge = getDesktopBridge();

        // Sync app version in header
        if (bridge && typeof bridge.getAppVersion === "function") {
          try {
            const version = await bridge.getAppVersion();
            const elVersion = document.getElementById("officepack-app-version");
            if (elVersion && version) {
              elVersion.textContent = version.startsWith("v") ? version : `v${version}`;
            }
          } catch {}
        }

        // Sync initial keep processes state
        if (bridge && typeof bridge.getKeepProcessesOnClose === "function") {
          try {
            const initialKeep = await bridge.getKeepProcessesOnClose();
            const chk = document.getElementById("chk-keep-processes");
            if (chk) chk.checked = Boolean(initialKeep);
          } catch {}
        }

        // Sync initial zoom level
        if (bridge && typeof bridge.getZoomLevel === "function") {
          try {
            currentZoomLevel = await bridge.getZoomLevel();
            updateZoomIndicator();
          } catch {}
        }

        // Live status listener
        if (bridge && typeof bridge.onInstanceStatusChanged === "function") {
          bridge.onInstanceStatusChanged((eventData) => {
            refreshInstancesList();
          });
        }

        // Live streaming log listener
        if (bridge && typeof bridge.onInstanceLogAdded === "function") {
          bridge.onInstanceLogAdded((logEntry) => {
            appendLiveLog(logEntry);
          });
        }

        // Load initial logs from all instances
        for (const inst of instancesCache) {
          if (bridge && typeof bridge.getInstanceLogs === "function") {
            bridge.getInstanceLogs(inst.id).then((logs) => {
              if (Array.isArray(logs)) {
                logs.forEach((l) => aggregatedLogsCache.push({ ...l, instanceId: inst.id }));
                renderDisplayLogs();
              }
            });
          }
        }

        // Periodic poll every 4 seconds for uptime/status sync
        setInterval(() => {
          refreshInstancesList();
          refreshBroadcastStatus();
        }, 4000);

        refreshBroadcastStatus();
